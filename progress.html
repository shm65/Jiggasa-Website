<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Progress (আমার প্রোগ্রেস) | জিজ্ঞাসা</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        .progress-box { background: var(--white); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-top: 16px; box-shadow: var(--shadow-sm); }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
        .history-item:last-child { border-bottom: none; }
        .note-storage { background: var(--primary-light); color: var(--primary); padding: 12px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 16px; }
    </style>
</head>
<body>
    <header class="top-nav">
        <div class="nav-container">
            <a href="index.html" class="logo"><i class="ph-fill ph-student"></i> জিজ্ঞাসা</a>
        </div>
    </header>

    <main class="container">
        <h2>My Learning Progress (ছাত্রছাত্রীর অগ্রগতি)</h2>
        
        <div class="progress-box">
            <div class="note-storage">
                <i class="ph ph-info"></i> Note: Your quiz activity is saved securely on this device's browser memory (localStorage).
            </div>

            <h3>Attempted Quizzes History</h3>
            <div id="history-list" style="margin-top: 12px;">
                <!-- Populated by JS -->
            </div>
            <button id="clear-history" style="margin-top: 16px; background: #dc2626; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.85rem;">Clear History</button>
        </div>
    </main>

    <nav class="bottom-nav">
        <a href="index.html"><i class="ph ph-house"></i><span>Home</span></a>
        <a href="classes.html"><i class="ph ph-books"></i><span>Classes</span></a>
        <a href="quizzes.html"><i class="ph ph-exam"></i><span>Quiz</span></a>
        <a href="progress.html" class="active"><i class="ph-fill ph-chart-line-up"></i><span>Progress</span></a>
        <a href="about.html"><i class="ph ph-user"></i><span>Teacher</span></a>
    </nav>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const listContainer = document.getElementById("history-list");
            const clearBtn = document.getElementById("clear-history");
            
            function loadHistory() {
                let history = JSON.parse(localStorage.getItem("jiggasha_attempts")) || [];
                if(history.length === 0) {
                    listContainer.innerHTML = "<p style='color: var(--text-muted);'>No quiz attempts recorded yet. Take a quiz to see your history!</p>";
                    clearBtn.style.display = "none";
                    return;
                }
                clearBtn.style.display = "block";
                listContainer.innerHTML = history.map(h => `
                    <div class="history-item">
                        <div>
                            <strong>${h.title}</strong>
                            <div style="font-size: 0.75rem; color: var(--text-muted);">Attempted on: ${h.date}</div>
                        </div>
                        <span style="color: #16a34a; font-weight: 600; font-size: 0.85rem;"><i class="ph ph-check-circle"></i> Completed</span>
                    </div>
                `).join("");
            }

            clearBtn.addEventListener("click", () => {
                if(confirm("Are you sure you want to clear your local history?")) {
                    localStorage.removeItem("jiggasha_attempts");
                    loadHistory();
                }
            });

            loadHistory();
        });
    </script>
</body>
</html>
